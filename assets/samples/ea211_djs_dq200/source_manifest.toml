[[needs_verification]]
id = "identity.donor_configuration"
required = ["full VIN", "PR-code label", "engine and transmission serials", "ECU/TCU hardware and software IDs", "production date", "emissions information sheet"]
reason = "A complete calibrated powertrain must be variant- and revision-specific."

[[needs_verification]]
id = "engine.power_torque_speed_curves"
required = ["DJS-specific homologation or OEM curve", "corrected engine-dynamometer map with uncertainty"]
reason = "The confirmed owner-manual table gives one rated-power point and a maximum-torque speed range, not full-load shape, part-load efficiency, limits, or transient behavior."

[[needs_verification]]
id = "engine.geometry_gas_exchange_combustion"
required = ["connecting-rod and chamber geometry", "valve lift/duration/phasing", "port flow", "crank-angle cylinder pressure", "friction and heat-transfer data"]
reason = "EA211 family descriptions are not DJS calibration data."

[[needs_verification]]
id = "engine_air_fuel_boost_control"
required = ["compressor and turbine maps", "turbo inertia", "charge-air-cooler data", "injector and rail-pressure dynamics", "actuator maps", "DJS ECU control traces"]
reason = "Feature-presence flags do not define dynamic behavior."

[[needs_verification]]
id = "engine_cooling_lubrication_accessories"
required = ["circuit topology", "pump maps", "thermostat behavior", "thermal masses and conductances", "oil pressure/temperature data", "starter, alternator and accessory loads"]
reason = "Required for cold start, heat soak, friction, and 12 V energy accounting."

[[needs_verification]]
id = "exhaust_aftertreatment"
required = ["VIN-specific component and sensor part numbers", "manifold/turbine/pipe/catalyst/GPF/muffler topology", "volumes and flow restrictions", "species conversion/storage/filter and thermal data"]
reason = "The C6 entry and vehicle-level filter diagnostic procedure do not uniquely define the DJS aftertreatment hardware."

[[needs_verification]]
id = "transmission_ratios_final_drives"
required = ["0CW.C gearbox code or build sheet", "measured input/output ratios for 1-7 and R", "each output-shaft final-drive ratio", "differential ratio"]
reason = "DQ200 family identity does not determine the selected gearset."

[[needs_verification]]
id = "transmission_mechanics"
required = ["shaft/gear/differential inertias", "mesh and bearing efficiency maps", "synchroniser capacities", "backlash", "halfshaft stiffness and damping"]
reason = "Needed for shift transient, loss, torsional, and axle-output simulation."

[[needs_verification]]
id = "transmission_dmf_clutches"
required = ["DMF inertia/stiffness/damping/hysteresis/stops", "K1/K2 clamp-force and travel maps", "friction versus slip/temperature/wear", "thermal capacity and cooling", "kiss-point adaptation traces"]
reason = "A dry DCT cannot be represented by ideal switches without losing launch, creep, judder, heat, and wear behavior."

[[needs_verification]]
id = "transmission_mechatronics_tcu"
required = ["0CW.C hydraulic diagram and component revision", "pump/accumulator/leak/valve dynamics", "sensor accuracy", "TCU schedules and state machines", "CAN signal definitions", "ECU torque-intervention traces", "fault and thermal-protection behavior"]
reason = "The early 0AM self-study publication is only an architectural reference."

[[needs_verification]]
id = "integrated_nvhe_and_audio"
required = ["crank and exhaust pressure pulsation", "input/output torsional speed", "gear-mesh orders", "case/mount accelerometers", "transfer functions to game audio events"]
reason = "Sound and vibration must be generated from the same physical state rather than a decorative RPM loop."

[[provisional_assumptions]]
id = "baseline.vehicle_choice"
statement = "Use SVW64010DT T-Cross DJS + DQ200 0CW.C as the initial integration target until a lawful donor VIN and PR-code set is selected."
sources = ["svw_tcross_owner_manual_2019", "svw_vin_rules_4_45", "mee_environmental_disclosure_2019_01"]
exit_condition = "Freeze a donor identity and update all component applicability records."

[[provisional_assumptions]]
id = "model.transmission_resolution"
statement = "Represent K1/K2, both input shafts, three output shafts, synchronisers, final drive, differential, mechatronic pressure, and clutch/selector actuators as dynamic components."
sources = ["vw_ssp_390_dq200_0am", "vw_ssp_513_dq200_0cw_bridge"]
exit_condition = "Replace any architecture-only defaults with 0CW.C-specific evidence and validate against rig traces."

[[provisional_assumptions]]
id = "model.controller_strategy"
statement = "Use transparent behavioural ECU/TCU surrogate controllers until lawful DJS/0CW.C timing and signal data are available; never embed unknown OEM maps as claimed facts."
sources = []
exit_condition = "Validate each controller path against documented or measured timing, saturation, fault, and torque-intervention behavior."

[[provisional_assumptions]]
id = "model.aftertreatment_strategy"
statement = "Reserve a configurable exhaust-aftertreatment graph from exhaust valves to tailpipe, but do not select catalyst/GPF topology until the donor emissions information and part numbers are known."
sources = ["svw_tcross_service_2024"]
exit_condition = "Freeze VIN-specific aftertreatment hardware and calibrate flow, species, and thermal states from measurements."

[measurement_program]
identity_and_teardown = [
  "VIN/PR codes and all relevant part/software IDs",
  "gear and final-drive tooth-count or ratio measurements",
  "3D flow-path and volume survey",
  "rotating inertia, mass, torsional stiffness, damping, and backlash"
]
engine_dyno = [
  "steady speed/load torque, air, fuel, lambda, rail pressure, ignition, injection, boost, and exhaust pressure/temperature",
  "motoring friction and accessory power",
  "crank-angle cylinder and port pressure with instantaneous crank speed",
  "coolant/oil flows, pressures, temperatures, and heat rejection",
  "cold-start, warm-up, transient tip-in/tip-out, knock-limit, and fault cases"
]
emissions_and_exhaust = [
  "engine-out and tailpipe gaseous species plus applicable particle mass/number",
  "pressure, temperature, mass flow, lambda, and sensor delay at each aftertreatment boundary",
  "light-off, oxygen storage, conversion efficiency, filter loading/regeneration, pressure drop, and thermal soak"
]
transmission_and_integration = [
  "synchronised engine/input/output/wheel speeds, axle torque, clutch positions/torque, selector positions, hydraulic pressure, pump current, and temperatures",
  "launch, creep, all up/down shifts, skip shifts, coastdown, reverse changes, hill start, cold/hot operation, protection, and faults",
  "ECU/TCU/ABS/gateway bus traces with a shared hardware time base",
  "clutch friction/thermal/wear and dual-mass-flywheel torsional identification"
]
data_governance = [
  "raw channels, calibration certificates, sample rates, filters, clock alignment, environment, uncertainty, and processing lineage",
  "lawful acquisition and redistribution metadata for every dataset"
]
