schema_version = 1
sample_id = "power.sample.psa_ec5_at8_4at"
display_name = "PSA EC5 + AT8 4AT complete powertrain"
asset_state = "research_skeleton"
scope = "complete_transverse_front_wheel_drive_powertrain"
last_reviewed = "2026-08-27"
default_parameter_status = "needs_verification"
numeric_fallback_policy = "forbidden"

[evidence_policy]
confirmed = "Directly supported for the stated vehicle, version, or family scope by an OEM publication or OEM technical/training material."
needs_verification = "Missing selected-donor evidence, or supported only for AL4, TU5, Flex Fuel EC5, another market, or another transmission pairing; no value may be silently supplied."
provisional = "A Power! integration or modelling decision, not an OEM fact; it must remain visible in capability and result metadata."
family_data_rule = "AL4 or generic EC5/TU5 data must not be promoted to the selected EC5 plus AT8 donor without an explicit applicability bridge."
derived_data_rule = "Derived values must retain source values, formula, units, uncertainty, and a derived flag; no derived numeric values are frozen in this skeleton."

[system_boundary]
contract_id = "power.complete_powertrain.v1"
shared_with = ["power.sample.ea211_djs_dq200"]
inlets = ["air_and_ambient", "fuel_and_evap_boundary", "12_v_supply", "driver_commands", "vehicle_network", "wheel_speed_and_road_load_feedback"]
included = ["engine_and_cranktrain", "intake_and_air_path", "fuel_and_ignition", "exhaust_aftertreatment_and_tailpipe", "cooling_lubrication_and_accessories", "low_voltage_electrics", "ECU_TCU_sensors_actuators_and_diagnostics", "engine_transmission_coupling", "transmission", "final_drive_and_differential", "left_and_right_halfshafts"]
outlets = ["left_and_right_halfshaft_torque", "tailpipe_mass_species_and_thermal_state", "heat_rejection", "electrical_load", "diagnostics", "NVH_and_audio_events"]
external = ["tyres", "service_brakes", "vehicle_body_and_aerodynamics", "road_and_grade"]
completeness_rule = "All listed included domains remain inside every complete-powertrain sample; samples may differ in component topology, parameters, and controls but may not omit electronics, exhaust/aftertreatment, thermal/fluid systems, or final-drive/halfshaft dynamics."

[baseline]
selection_status = "provisional"
vehicle_make = "Citroen"
vehicle_line = "C-Elysee, launch-era training configuration"
vehicle_document_reference = "C_15473, 2012-07-24"
market_and_build_code = "unfrozen"
engine_code = "EC5"
engine_variant_descriptor = "115 Ch in the cited training publication; complete type and market calibration unfrozen"
transmission_family = "BVA AT8"
transmission_forward_gears = 4
layout = "transverse_front_engine_front_wheel_drive"
selection_reason = "The Citroen C-Elysee training publication directly pairs its EC5 115 Ch version with the four-speed AT8, while the Peugeot Citroen Moteurs sheet independently identifies AT8 as a transverse four-gear hydraulic automatic compatible with EC5."

variant_warning = "EC5 is not a single globally interchangeable calibration: a documented Flex Fuel L6 EC5 has E22/E100-specific data, and later official vehicle material pairs EC5 with EAT6. AT8 here means the four-forward-gear PSA BVA AT8, not the later eight-speed EAT8."
lineage_warning = "Citroen technical material describes AT8 as replacing/evolving AL4 with changes to the torque converter and management software. This supports a shared lineage, not identity of every part, ratio, hydraulic value, or control map."

