[[needs_verification]]
id = "identity.donor_configuration"
required = ["full VIN", "DAM/OPR", "market and vehicle project/build code", "engine full type and serial", "AT8 manufacturing number and serial", "ECU/TCU hardware and software IDs", "production date", "emissions information"]
reason = "EC5 plus AT8 and a 115 Ch label do not uniquely identify a calibrated powertrain."

[[needs_verification]]
id = "engine.version_and_rated_output"
required = ["donor-specific OEM or homologation data", "fuel specification", "rated power and speed", "maximum torque and speed range", "dynamometer curve with uncertainty"]
reason = "The candidate source gives only the code and 115 Ch descriptor; other EC5 versions use different fuels, outputs, controllers, and transmissions."

[[needs_verification]]
id = "engine.geometry_gas_exchange_combustion"
required = ["displacement/bore/stroke/compression verification", "connecting-rod and chamber geometry", "valve lift/duration/phasing", "port flow", "crank-angle cylinder pressure", "friction and heat-transfer data"]
reason = "Flex Fuel EC5 and TU5 family values are not selected-donor evidence."

[[needs_verification]]
id = "engine_air_fuel_ignition_control"
required = ["intake and throttle topology", "injector and fuel-pressure dynamics", "fuel properties", "ignition hardware and dwell", "EC5 ECU identity and control traces", "idle, knock, protection, and fault behavior"]
reason = "Required for a dynamic engine model and not specified by the pairing source."

[[needs_verification]]
id = "engine_cooling_lubrication_accessories"
required = ["circuit topology", "pump maps", "thermostat behavior", "thermal masses and conductances", "oil pressure/temperature data", "starter, alternator, air-conditioning, steering, and other accessory loads"]
reason = "Required for cold start, heat soak, friction, and 12 V energy accounting."

[[needs_verification]]
id = "exhaust_aftertreatment"
required = ["VIN-specific manifold/catalyst/sensor/muffler part numbers", "topology and volumes", "flow restrictions", "species conversion/oxygen-storage and thermal data"]
reason = "No selected-donor emissions package is established."

[[needs_verification]]
id = "transmission.identity_ratios_final_drive"
required = ["AT8 manufacturing type/number", "measured 1-4 and reverse ratios", "step-down ratio", "final-drive ratio", "differential and halfshaft identity"]
reason = "The AT8 product sheet contains multiple application and final-drive rows; no ratio is selected or guessed."

[[needs_verification]]
id = "transmission.torque_converter_and_lockup"
required = ["AT8 converter part identity", "capacity-factor and torque-ratio curves", "stator one-way-clutch behavior", "lock-up hardware confirmation", "lock-up friction/thermal maps", "application and slip-control schedule"]
reason = "AT8 is documented as having an evolved torque converter, but AL4 converter and lock-up values cannot be assumed unchanged."

[[needs_verification]]
id = "transmission_planetary_and_friction_dynamics"
required = ["AT8 gearset connection and tooth-count verification", "shaft/gear/differential inertias and efficiency", "E1/E2/F1/F2/F3 capacity, clearance, friction, return, fill, and thermal data", "parking mechanism"]
reason = "Family diagrams define topology but not selected-donor dynamic parameters."

[[needs_verification]]
id = "transmission_hydraulics_atf_thermal"
required = ["ATF specification and fill for the donor", "pump displacement/efficiency", "main-pressure map", "valve and solenoid flow/force dynamics", "leakage and fill volumes", "heat-exchanger topology", "temperature-viscosity and friction relationships"]
reason = "A four-speed hydraulic automatic needs pressure and thermal state to reproduce launch, shifting, protection, wear, and faults."

[[needs_verification]]
id = "transmission_controller_and_network"
required = ["TCU/transmission-ECU identity", "shift/lock-up/creep/protection/fail-safe state machines", "adaptation data", "ECU torque-intervention handshake", "BSI/ABS/gateway message IDs, scaling, periods, and timeouts"]
reason = "The documented software evolution makes donor-specific control evidence essential."

[[needs_verification]]
id = "integrated_nvhe_and_audio"
required = ["crank/exhaust pressure pulsation", "converter/input/output torsional speed", "lock-up shudder", "gear-mesh orders", "case/mount accelerometers", "transfer functions to game audio events"]
reason = "Sound and vibration must be generated from the same physical state rather than a decorative RPM loop."

[[provisional_assumptions]]
id = "baseline.vehicle_choice"
statement = "Use the launch-era C-Elysee EC5 115 Ch plus four-speed AT8 configuration in training document C_15473 as the initial integration target until a lawful donor identity is frozen."
sources = ["citroen_c_elysee_training_c15473_2012", "pcm_at8_datasheet_2018"]
exit_condition = "Freeze VIN, DAM/OPR, market/build code, complete engine type, AT8 manufacturing number, emissions package, and software identities."

[[provisional_assumptions]]
id = "model.transmission_resolution"
statement = "Represent the torque converter and optional lock-up path, oil pump, hydraulic pressure/valve dynamics, both epicyclic gearsets, E1/E2, F1/F2/F3, step-down/output path, final drive, differential, and halfshafts as dynamic components."
sources = ["citroen_al4_at8_after_sales_2011", "citroen_technical_meeting_2012", "citroen_al4_training_reference"]
exit_condition = "Replace architecture-only placeholders with AT8 donor evidence and validate all states against rig traces."

[[provisional_assumptions]]
id = "model.controller_strategy"
statement = "Use transparent behavioural ECU/TCU surrogate controllers until lawful donor timing and signal data are available; never embed unknown OEM maps as claimed facts."
sources = []
exit_condition = "Validate each controller path against documented or measured timing, saturation, adaptation, fault, shift, lock-up, and torque-intervention behavior."

[[provisional_assumptions]]
id = "model.aftertreatment_strategy"
statement = "Reserve a configurable exhaust-aftertreatment graph from exhaust valves to tailpipe, but do not select catalyst/sensor topology until donor emissions information and part numbers are known."
sources = []
exit_condition = "Freeze VIN-specific aftertreatment hardware and calibrate flow, species, and thermal states from measurements."

[measurement_program]
identity_and_teardown = [
  "VIN, DAM/OPR, market/build code, all relevant part/manufacturing/software IDs, and emissions information",
  "measured 1-4, reverse, step-down, and final-drive ratios without relying on internet tables",
  "converter, gearset, friction-element, hydraulic, differential, halfshaft, intake, cooling, lubrication, electrical, and exhaust connection survey",
  "rotating inertia, mass, torsional stiffness, damping, backlash, and critical flow volumes"
]
engine_dyno = [
  "steady speed/load torque, air, fuel, lambda, manifold pressure/temperature, ignition, injection, and exhaust pressure/temperature",
  "motoring friction and accessory power",
  "crank-angle cylinder and port pressure with instantaneous crank speed",
  "coolant/oil flows, pressures, temperatures, and heat rejection",
  "cold-start, warm-up, transient tip-in/tip-out, knock-limit, and fault cases"
]
emissions_and_exhaust = [
  "engine-out and tailpipe gaseous species plus applicable particle metrics",
  "pressure, temperature, mass flow, lambda, and sensor delay at each aftertreatment boundary",
  "light-off, oxygen storage, conversion efficiency, pressure drop, and thermal soak"
]
transmission_and_integration = [
  "synchronised engine, converter turbine/input, output, and wheel speeds; axle torque; selector/gear; friction-element and solenoid commands; main pressure; ATF temperature",
  "converter capacity factor, torque ratio, stator transition, lock-up slip/friction/thermal identification",
  "launch, creep, all up/down shifts, coastdown, reverse changes, hill start, cold/hot operation, protection, and hydraulic/electrical faults",
  "pressure-based clutch/brake fill and torque-transfer identification plus geartrain efficiency, backlash, and halfshaft torsion",
  "ECU/TCU/BSI/ABS/gateway traces with a shared hardware time base"
]
data_governance = [
  "raw channels, calibration certificates, sample rates, filters, clock alignment, environment, uncertainty, and processing lineage",
  "lawful acquisition and redistribution metadata for every dataset"
]
