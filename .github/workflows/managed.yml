name: Managed core and agent interface
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: managed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  MSBUILDDISABLENODEREUSE: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: dotnet restore Power.slnx --locked-mode --disable-parallel --disable-build-servers -p:UseSharedCompilation=false
      - run: dotnet run --file tools/Build.cs -p:UseSharedCompilation=false -- verify
